# Publish ratchet-mcp to npm, with provenance.
#
# Triggered by publishing a GitHub release, so the tag, the release notes and
# the package version are one event rather than three manual steps that can
# disagree. --provenance signs the package with a verifiable statement of which
# workflow, at which commit, produced it: npm shows the badge, and OpenSSF
# Scorecard reads it for both Packaging and Signed-Releases.
#
# Needs an NPM_TOKEN secret (an automation token, not a publish-with-2FA one) or
# the job is skipped rather than failed — a missing credential is a setup step,
# not a broken build.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the SBOM to the release
      id-token: write        # what lets npm attach provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The bin is a single dependency-free file, so there is nothing to build
      # and nothing to install. It is still checked before it is published.
      - name: The server must speak MCP before it is published
        working-directory: packages/ratchet-mcp
        run: |
          node --check bin/ratchet-mcp.mjs
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node bin/ratchet-mcp.mjs 2>/dev/null \
            | grep -q '"result"' || { echo "initialize did not return a result"; exit 1; }

      # The adapter is the thing a customer points at their vendor credential, so
      # it gets checked before it is published too. --help is a real exercise of
      # the argument parsing, and a dry run proves the property the whole design
      # turns on: it must reach the vendor and never reach /v1/reconcile, because
      # every call there records a run and resets the cadence clock.
      - name: The adapter must run, and a dry run must post nothing
        working-directory: packages/ratchet-reconcile
        run: |
          set -euo pipefail
          for f in bin/*.mjs lib/*.mjs lib/connectors/*.mjs; do node --check "$f"; done

          help=$(node bin/ratchet-reconcile.mjs --help)
          printf '%s' "$help" | grep -q 'ratchet-reconcile' \
            || { echo "--help produced nothing usable"; exit 1; }

          # Refusing an unknown vendor is SUPPOSED to exit non-zero, so the
          # output is captured before it is examined. Piping it into grep under
          # `set -o pipefail` fails on the adapter's own correct exit code —
          # which is what happened on the first attempt at v0.3.0, and it read
          # as "unknown vendor was not refused" when the refusal was working
          # perfectly. Assert the code as well, since it is the contract a cron
          # branches on.
          #
          # No RATCHET_API_KEY on purpose: a dry run must not require one, or
          # people paste a production key in order to rehearse.
          set +e
          out=$(node bin/ratchet-reconcile.mjs --vendor nope --effect-type x 2>&1)
          code=$?
          set -e
          printf '%s' "$out" | grep -q 'Unknown --vendor' \
            || { echo "unknown vendor was not refused; got: $out"; exit 1; }
          [ "$code" = "2" ] \
            || { echo "expected exit 2 for a usage error, got $code"; exit 1; }

      # Provenance answers "which workflow, at which commit". It does not answer
      # "was that commit the one the maintainer released" — a release can be cut
      # from any tag, including an unsigned or a lightweight one, and the
      # attestation would still be perfectly genuine about a commit nobody
      # vouched for. Tags are signed now, so require the signature to verify
      # before anything reaches npm.
      - name: The tag being published must carry a verified signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-v$(node -p "require('./packages/ratchet-mcp/package.json').version")}"
          echo "checking $TAG"

          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
                  --jq '.object.type + " " + .object.sha')
          type="${ref% *}"; sha="${ref#* }"

          # Only an annotated tag object can carry a signature at all.
          if [ "$type" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag, so it carries no signature."
            echo "  Re-create it signed:  git tag -s ${TAG} <commit> -m '...' && git push --force origin ${TAG}"
            exit 1
          fi

          v=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')
          r=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.reason')
          if [ "$v" != "true" ]; then
            echo "::error::${TAG} signature did not verify (${r})."
            echo "  A signing key must be registered at https://github.com/settings/keys"
            exit 1
          fi
          echo "${TAG}: signature verified (${r})"

      # An SBOM per release, in both formats procurement actually asks for.
      # The dependency set is small and pinned by a committed lockfile, but a
      # lockfile is not an SBOM: it says what we resolved, not what shipped, and
      # it is not in a format anybody else's tooling reads.
      #
      # Generated after the signature check above, so the bill of materials
      # describes a commit whose tag verified.
      # npm sbom reads the INSTALLED tree, and nothing here installed one, so
      # every dependency came back missing and the step had never once
      # succeeded — it was added on 5 Sep, and the last publish that worked was
      # on the 3rd.
      #
      # A full install, not --omit=dev. `npm sbom --omit dev` filters the OUTPUT
      # but still validates the whole tree against the lockfile, so a
      # production-only install fails with ESBOMPROBLEMS on the devDependencies
      # it was told to ignore. Verified both ways rather than assumed.
      - name: Install, so there is a tree to describe
        run: npm ci

      - name: Software bill of materials
        run: |
          set -euo pipefail
          mkdir -p sbom
          npm sbom --sbom-format spdx      --omit dev > sbom/ratchet.spdx.json
          npm sbom --sbom-format cyclonedx --omit dev > sbom/ratchet.cyclonedx.json
          for f in sbom/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error::$f is not valid JSON"; exit 1; }
            echo "  $f  $(wc -c < "$f") bytes"
          done

      - name: Attach the SBOM to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom/*.json --clobber

      # Publishing a version that is already on npm is a hard error, so a
      # re-run of this workflow — after a transient failure, or a second package
      # added later — would fail on the package that already went out. Skipping
      # what is already published makes the job idempotent and lets the two
      # packages carry different versions without the release tag having to know.
      - name: Publish ratchet-mcp
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/ratchet-mcp
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          if npm view "ratchet-mcp@$V" version >/dev/null 2>&1; then
            echo "ratchet-mcp@$V is already on npm; nothing to do."
          else
            npm publish --provenance --access public
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish ratchet-reconcile
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/ratchet-reconcile
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          if npm view "ratchet-reconcile@$V" version >/dev/null 2>&1; then
            echo "ratchet-reconcile@$V is already on npm; nothing to do."
          else
            npm publish --provenance --access public
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Say why nothing was published
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "NPM_TOKEN is not set, so nothing was published."
          echo "Add an automation token: gh secret set NPM_TOKEN"
