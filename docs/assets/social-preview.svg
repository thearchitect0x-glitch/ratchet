      <stop offset="0" stop-color="#1c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0b0d12"/>
  <rect width="1280" height="640" fill="url(#g)"/>

