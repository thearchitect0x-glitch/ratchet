  <g transform="translate(568 130) scale(2.25)">
    <rect width="64" height="64" rx="14" fill="#1c5cff"/>
    <path d="M32 12 51 23v18L32 52 13 41V23L32 12Z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
